<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinOps Portal{% endblock %} - CentrAlign AI</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/inbox" class="nav-brand">
            <span class="brand-badge">Enterprise</span>
            <span>FinOps Portal</span>
        </a>
        <div class="nav-links">
            <a href="/inbox" class="nav-link {% if active_page == 'inbox' %}active{% endif %}" id="nav-inbox">
                📧 Vendor Inbox
            </a>
            <a href="/bills" class="nav-link {% if active_page == 'bills' %}active{% endif %}" id="nav-bills">
                💰 Finance System
            </a>
            <a href="/bills/create" class="nav-link {% if active_page == 'create_bill' %}active{% endif %}" id="nav-create-bill">
                ➕ Create Bill
            </a>
            <a href="/agent" class="nav-link highlight {% if active_page == 'agent' %}active{% endif %}" id="nav-agent">
                🤖 Agent Cockpit
            </a>
            <button onclick="resetData()" class="btn btn-secondary btn-sm" id="reset-system-btn" title="Deterministic Reset">
                🔄 Reset State
            </button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>CentrAlign AI — Autonomous AI Task Worker &amp; FinOps Mock Environment | Ground-Truth Isolated</p>
    </footer>

    <script>
        async function resetData() {
            if (confirm("Reset inbox emails and finance bills to initial deterministic seed state?")) {
                try {
                    const res = await fetch('/api/reset', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        alert("Environment successfully reset to deterministic seed data.");
                        window.location.reload();
                    }
                } catch (e) {
                    alert("Reset failed: " + e.message);
                }
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
